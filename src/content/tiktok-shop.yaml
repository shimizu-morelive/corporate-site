# /tiktok-shop のページ。改行させたい位置には \n を入れる（それ以外の改行は自動で調整される）。
# 事実は TikTok の公式情報（2025年6月30日の発表 newsroom.tiktok.com / ads.tiktok.com と、セラー向け解説 seller-jp.tiktok.com）に合わせている。数字や時期を足すときは公式情報で確かめる。
tiktok-shop:
  # 仮の文言（要確認）
  meta:
    title: TikTok Shopとは？仕組みと売り方 | 株式会社モアライブ
    description: TikTok Shopの仕組みを、ショッピング動画・LIVE配信・商品ショーケース・アフィリエイトに分けてやさしく解説します。メーカー・小売事業者とライブコマーサーにとっての活用ポイントと、モアライブの支援もご紹介します。

  # 仮の文言（要確認）
  breadcrumb:
    name: パンくずリスト
    home: TOP
    label: TikTok Shopとは

  # ヒーローの大きな英字（飾り。読み上げない）
  word: SHOP  # 仮の文言（要確認）
  # 「とは」の途中で折り返さないよう、ここで改行する
  title: "TikTok Shop\nとは"  # 仮の文言（要確認）
  lead: TikTokのアプリの中で、商品を見つけてから買うまでが完結するEC機能です。動画やLIVEをきっかけに、まだ知らなかった商品と出会えます。  # 仮の文言（要確認）
  image: ../assets/illustrations/tiktok-shop.png
  imageCaption: 動画やLIVEで見つけた商品を、その場で買える。それがTikTok Shopの売り場です。  # 仮の文言（要確認）

  # 仮の文言（要確認）
  stat:
    eyebrow: LAUNCHED IN JAPAN
    value: "2025.06.30"
    label: 2025年6月30日、日本で提供開始
    text: TikTokは、発見から購入までをアプリの中で完結させる新しい買い物の形を「ディスカバリーEコマース」と呼んでいます。

  # 仮の文言（要確認）
  intro:
    eyebrow: OVERVIEW
    title: "見つけたその場で、\n買える売り場。"
    descriptions:
      - 「おすすめ」フィードに流れる動画やLIVE配信で紹介された商品は、その場で購入できます。検索して探すのではなく、楽しんで見ているうちに商品と出会えるのが、TikTok Shopの大きな特徴です。
      - TikTokの発表によると、商品レビューや報告機能、返品・返金の手続きが用意されています。出品は、技術と人の目によるチェックで、ポリシーに沿って管理されています。

  # 仮の文言（要確認）
  ways:
    eyebrow: HOW IT SELLS
    title: 商品と出会う4つの入り口
    text: TikTok Shopには、商品を知ってから購入するまでの入り口がいくつもあります。それぞれの役割を知ると、売り方を組み立てやすくなります。
    items:
      - title: ショッピング動画
        icon: product
        summary: 商品をタグ付けした短い動画です。使っている様子や特徴を見せながら、気になった人をそのまま購入へ案内できます。
        points: [「おすすめ」フィードで、まだ商品を知らない人にも届く, 実演や使用シーンで魅力を伝えられる, 動画から商品の購入へすぐ進める]
      - title: LIVE配信
        icon: live
        summary: 商品を紹介しながら、視聴者とリアルタイムで会話できる配信です。質問にその場で答えられるので、納得して選んでもらえます。
        points: [視聴者の質問にその場で答えられる, 実演や比較でくわしく伝えられる, 配信中に紹介した商品をその場で購入できる]
      - title: 商品ショーケース
        icon: purchase
        summary: ブランドのプロフィールページに並ぶ商品一覧です。商品を見比べたり、レビューを確かめたりしてから購入できます。  # 仮の文言（要確認）
        points: [プロフィールから商品一覧を見られる, レビューを確かめてから選べる, 動画やLIVEのあとにも立ち寄れる売り場になる]
      - title: アフィリエイト
        icon: creator
        summary: セラー（商品を販売する事業者）とクリエイターをつなぐ、成果報酬型の仕組みです。クリエイターは動画やLIVEで商品を紹介し、成果に応じて報酬を得られます。
        points: [セラーは報酬率を決めて、クリエイターに紹介を依頼できる, 自社のアカウント以外からも商品を紹介してもらえる, クリエイターは紹介した成果が報酬になる]  # 仮の文言（要確認）

  # 仮の文言（要確認）
  audiences:
    eyebrow: WHY IT MATTERS
    title: それぞれにとってのTikTok Shop
    items:
      - label: FOR MANUFACTURERS & RETAILERS
        # 自動の改行だと「小売事｜業者」で切れるため、ここで改行する
        title: "メーカー・\n小売事業者にとって"
        text: 検索されるのを待つのではなく、動画やLIVEをきっかけに、商品をまだ知らない人と出会える新しい販売チャネルです。
        points: [既存のECとは異なる顧客接点をつくれる, 実演や質問への回答で、商品の魅力を伝えられる, クリエイターの紹介で、届く範囲を広げられる]
      - label: FOR COMMERCE CREATORS
        title: ライブコマーサーにとって
        text: 動画やLIVEで商品を紹介し、その成果が報酬につながる活動の場です。話す力や伝える力を、そのまま仕事にできます。
        points: [配信で紹介した商品を、その場で買ってもらえる, アフィリエイトで、成果に応じた報酬を得られる, 視聴者との会話が、そのまま売り場になる]

  # 仮の文言（要確認）。本文とカードは site.yaml の service.intro と各サービスの card をそのまま使う
  support:
    eyebrow: HOW WE HELP
    title: モアライブの支援

  # 仮の文言（要確認）。ここの文章は、ページに見える形でそのまま出し、検索エンジン向けのデータ（FAQPage）にも使う
  faq:
    eyebrow: FAQ
    title: よくある質問
    items:
      - q: TikTok Shopとは何ですか？
        a: TikTokのアプリの中で、商品を見つけてから購入するまでを完結できるEC機能です。日本では2025年6月30日に提供が始まりました。
      - q: どこで商品を買えますか？
        a: 「おすすめ」フィードに流れる動画やLIVE配信でタグ付けされた商品は、その場で購入できます。ブランドのプロフィールページにある商品ショーケースからも、商品一覧やレビューを見て購入できます。  # 仮の文言（要確認）
      - q: クリエイターはどのように報酬を得るのですか？
        a: アフィリエイトの仕組みでは、クリエイターがショート動画やLIVE配信で商品を紹介し、そこから商品が購入されると、セラーからコミッション（成果報酬）を受け取ります。報酬率や参加の条件は、TikTok Shopの公式情報をご確認ください。  # 仮の文言（要確認）
      - q: 買い物は安心してできますか？
        a: TikTokの発表によると、商品レビューや報告機能、返品・返金の手続きが用意され、決済は外部の決済サービスと連携しています。出品は、技術と人の目によるチェックでポリシーに沿って管理されています。
      - q: ライブコマーサーとして活動したいのですが、相談できますか？
        a: はい。これまでの活動や、今後取り組みたいことをお知らせください。ライブコマースを仕事にしたい方、さらに活動の幅を広げたい方からのご連絡をお待ちしています。

  # 仮の文言（要確認）
  cta:
    eyebrow: CONTACT
    title: "TikTok Shopのことを、\n相談する"
    text: 出店を考えている方も、配信を始めたい方も。まだ具体的な相談内容が固まっていなくても構いません。
    label: お問い合わせはこちら
