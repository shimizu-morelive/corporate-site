# プライバシーポリシー（/privacy）の文言。すべて仮の文言で、公開前に会社として内容を確かめる（できれば専門家にも）。
# 書いてある取り扱いが、実際のやり方と合っているかを必ず確かめる。
privacy:
  meta:
    title: プライバシーポリシー | 株式会社モアライブ
    description: 株式会社モアライブが、お問い合わせなどでお預かりする個人情報の取り扱いについてまとめています。 # 仮の文言（要確認）
  eyebrow: PRIVACY POLICY
  title: プライバシーポリシー
  lead: 株式会社モアライブ（以下「当社」）は、お客さまからお預かりする個人情報を大切に取り扱うため、次のとおり方針を定めます。 # 仮の文言（要確認）
  # 公開する日に合わせて直す
  updated: 制定日：2026年11月1日 # 仮の文言（要確認）
  sections: # 仮の文言（要確認）
    - heading: 1. お預かりする情報
      body:
        - 本サイトのお問い合わせフォームから、次の情報をお預かりします。
      items: [お問い合わせの種別, 会社名・活動名（任意）, お名前, メールアドレス, お問い合わせの内容]
    - heading: 2. 利用の目的
      body:
        - お預かりした情報は、お問い合わせへの回答と、そのためのご連絡にのみ使用します。
    - heading: 3. 第三者への提供
      body:
        - 法令に基づく場合を除き、ご本人の同意なく第三者に提供することはありません。
    # 外国の事業者に預けることの書き方は、個人情報保護法に沿っているか要確認
    - heading: 4. 業務の委託
      body:
        - お問い合わせの内容は、メール送信サービス（Resend, Inc.／米国）を通じて当社に届きます。委託先には必要な範囲でのみ情報を預け、適切に管理されるよう努めます。
    - heading: 5. 安全管理
      body:
        - 個人情報の漏えい、滅失またはき損を防ぐため、必要かつ適切な安全管理措置を講じます。
    - heading: 6. 開示・訂正・削除などのご請求
      body:
        - ご本人から、ご自身の個人情報の開示、訂正、利用の停止、削除などのご請求があった場合は、ご本人であることを確認したうえで、法令に従って対応します。
    - heading: 7. お問い合わせ窓口
      body:
        - 個人情報の取り扱いに関するお問い合わせは、次のメールアドレスまでご連絡ください。当社の所在地と代表者は、会社概要に記載しています。
      links:
        - { label: info@more-live.com, href: "mailto:info@more-live.com" }
        - { label: 会社概要を見る, href: "/#company" }
    - heading: 8. 改定
      body:
        - この方針は、法令の改正や業務の変更に合わせて見直すことがあります。改定した内容は、このページに掲載した時点から適用します。
